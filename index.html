<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jerapah Dollar AI - WD Beneran</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap');
body{font-family:'Fredoka',sans-serif; background:linear-gradient(#87CEEB,#E0F6FF); overflow:hidden}
.giraffe{font-size:110px; animation:idle 1s infinite alternate}
@keyframes idle{from{transform:translateY(0)} to{transform:translateY(-8px)}}
@keyframes joget{0%{transform:scale(1) rotate(-12deg)} 50%{transform:scale(1.25) rotate(12deg)} 100%{transform:scale(1) rotate(-12deg)}}
.joget{animation:joget 0.2s ease}
</style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-between p-4">
<div class="w-full max-w-sm bg-white rounded-3xl p-3 shadow-xl flex justify-between border-4 border-yellow-400">
<div>🪙 <b id="coin">100</b></div><div>💲$<b id="dollar">0.10</b></div>
</div>
<div class="flex-1 flex flex-col items-center justify-center">
<div id="giraffe" class="giraffe" onclick="tap()">🦒</div>
<div class="text-5xl -mt-8">🕶️</div>
<p class="bg-black text-white px-3 py-1 rounded-full text-xs mt-2">TAP AKU!</p>
</div>
<div class="w-full max-w-sm grid grid-cols-1 gap-2">
<button onclick="tap()" class="bg-orange-400 border-b-8 border-orange-600 text-white text-xl py-4 rounded-2xl font-bold">TAP JOGET! (+10)</button>
<button onclick="openWD()" class="bg-green-500 border-b-4 border-green-700 text-white py-3 rounded-xl font-bold">💸 WD KE DANA - 082318560428</button>
</div>

<div id="wdModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
<div class="bg-white rounded-3xl p-6 w-full max-w-sm border-4 border-green-400">
<h2 class="text-xl font-bold text-center">💸 WD Beneran</h2>
<p class="text-center text-xs mb-3">Min WD $1 = 1000 Koin</p>
<input id="nama" placeholder="Nama DANA" class="w-full border-2 rounded-xl p-3 mb-2">
<input id="dana" placeholder="No DANA (08xxx)" class="w-full border-2 rounded-xl p-3 mb-2">
<input id="jml" placeholder="Jumlah $ contoh: 1" type="number" class="w-full border-2 rounded-xl p-3 mb-3">
<div class="grid grid-cols-2 gap-2">
<button onclick="closeWD()" class="bg-gray-200 py-3 rounded-xl">Batal</button>
<button onclick="kirimWD()" class="bg-green-500 text-white py-3 rounded-xl">Kirim WD</button>
</div>
</div>
</div>

<script>
let coin = parseInt(localStorage.getItem('coin')||'100');
const coinEl=document.getElementById('coin'), dollarEl=document.getElementById('dollar'), gEl=document.getElementById('giraffe');
function updateUI(){ coinEl.innerText=coin; dollarEl.innerText=(coin/1000).toFixed(2); }
updateUI();
function tap(){ coin+=10; localStorage.setItem('coin',coin); updateUI(); gEl.classList.remove('joget'); void gEl.offsetWidth; gEl.classList.add('joget'); }
function openWD(){ document.getElementById('wdModal').classList.remove('hidden'); document.getElementById('wdModal').classList.add('flex'); }
function closeWD(){ document.getElementById('wdModal').classList.add('hidden'); document.getElementById('wdModal').classList.remove('flex'); }
function kirimWD(){
  const nama=document.getElementById('nama').value, dana=document.getElementById('dana').value, jml=document.getElementById('jml').value;
  if(!nama||!dana||!jml){ alert('Lengkapi dulu kak!'); return; }
  if(coin < jml*1000){ alert('Koin kurang! Butuh '+jml*1000+' koin. Kamu punya '+coin); return; }
  coin-=jml*1000; localStorage.setItem('coin',coin); updateUI(); closeWD();
  const adminWA='6282318560428';
  const pesan=`Halo Kak Tomi! WD JERAPAH DOLLAR:%0A%0ANama: ${nama}%0ANo DANA: ${dana}%0AWD: $${jml} (${jml*1000} koin)%0ASisa Koin User: ${coin}%0A%0ALink Game: https://tomisantosa629.github.io/Jerapah-Dollar-/`;
  window.open(`https://wa.me/${adminWA}?text=${pesan}`,'_blank');
  alert('WD Terkirim ke WA kakak 082318560428! Cek WhatsApp kakak!');
}
</script>
</body>
</html>
