<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jerapah Dollar 15x</title><script src="https://cdn.tailwindcss.com"></script><style>@keyframes runLeft{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}.run-left{animation:runLeft 15s linear infinite}</style></head><body class="bg-sky-200 min-h-screen flex flex-col items-center p-0"><div class="w-full bg-black text-yellow-300 py-1 overflow-hidden whitespace-nowrap text-[11px] font-bold"><div class="run-left inline-block">🔥 TAP 15x = IKLAN BONUS! 🔥 AJAK TEMAN 2500 KOIN! 🔥</div></div><div class="bg-white w-full max-w-sm rounded-xl p-3 flex justify-between font-bold text-sm mt-2"><span>🪙<b id="coin">100</b> (<span id="tapInfo">0/15</span>)</span><span>$<b id="dollar">0.02</b></span></div><div onclick="tap()" class="text-[90px] mt-1 text-center">🦒<div class="text-[35px] -mt-2">🕶️</div><div class="text-[11px] bg-black text-white px-3 py-1 rounded-full mt-1">TAP AKU! (<span id="tapCountText">0</span>)</div></div><div class="bg-yellow-100 border-2 border-yellow-400 rounded-xl p-2 w-full max-w-sm mt-2 text-center"><p class="text-xs font-bold">🤖 AUTO: +<span id="autoCoin">1</span>/dtk | Tap ke-15 = Iklan!</p><div class="w-full bg-gray-200 rounded-full h-2 mt-1"><div id="progress" class="bg-green-500 h-2 rounded-full" style="width:0%"></div></div></div><div class="w-full max-w-sm mt-3 grid gap-2 px-3"><button onclick="tap()" class="bg-orange-400 border-b-8 border-orange-600 text-white py-4 rounded-2xl font-bold text-xl">TAP JOGET! (+5)</button><button onclick="upgradeAuto()" class="bg-blue-500 border-b-4 border-blue-700 text-white py-2 rounded-xl font-bold text-xs">⬆️ UPGRADE AUTO (<span id="upgradeCost">500</span>)</button><button onclick="openInvite()" class="bg-purple-500 border-b-4 border-purple-700 text-white py-3 rounded-xl font-bold">👥 AJAK TEMAN = 2500</button><button onclick="openWD()" class="bg-green-500 border-b-4 border-green-700 text-white py-3 rounded-xl font-bold">💸 WD $5</button></div><div id="adModal" style="display:none" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-2xl p-5 w-full max-w-sm text-center"><h3 class="font-bold text-lg">🎬 IKLAN BONUS 15 TAP!</h3><p class="text-xs">Kamu udah tap 15x! Nonton 5 detik dapat +20 koin!</p><div class="bg-gray-100 rounded-xl p-6 my-3 font-bold">IKLAN VIDEO<br>5 DETIK</div><button onclick="closeAd()" id="closeBtn" class="bg-gray-300 w-full py-3 rounded-xl font-bold">Tunggu 5 detik...</button></div></div><div id="inviteModal" style="display:none" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-2xl p-5 w-full max-w-sm text-center"><p id="inviteLink" class="text-[10px] font-bold break-all bg-gray-100 p-2 rounded my-3"></p><button onclick="shareWA()" class="bg-green-500 text-white w-full py-3 rounded-xl font-bold">📲 SHARE WA</button><button onclick="closeInvite()" class="bg-gray-200 w-full py-2 rounded-xl mt-3">Tutup</button></div></div><div id="wdModal" style="display:none" class="fixed inset-0 bg-black/60 z-40 flex items-center justify-center p-4"><div class="bg-white rounded-2xl p-5 w-full max-w-sm"><h2 class="font-bold text-center">WD $5 = 25000 Koin</h2><input id="nama" placeholder="Nama DANA" class="w-full border-2 p-3 rounded-xl mt-2"><input id="dana" placeholder="No DANA" class="w-full border-2 p-3 rounded-xl mt-2"><button onclick="kirimWD()" class="w-full bg-green-500 text-white py-3 rounded-xl mt-3 font-bold">Kirim</button><button onclick="closeWD()" class="w-full bg-gray-200 py-2 rounded-xl mt-2">Batal</button></div></div><script>let coin=parseInt(localStorage.getItem('coin')||'100'),auto=parseInt(localStorage.getItem('auto')||'1'),tapCount=parseInt(localStorage.getItem('tapCount')||'0'),friends=parseInt(localStorage.getItem('friends')||'0'),myCode=localStorage.getItem('myCode')||'JER'+Math.random().toString(36).substring(2,6).toUpperCase();localStorage.setItem('myCode',myCode);function getCost(l){return 500*Math.pow(2,l-1)}let upgradeCost=getCost(auto+1);function updateUI(){document.getElementById('coin').innerText=coin;document.getElementById('dollar').innerText=(coin/5000).toFixed(2);document.getElementById('autoCoin').innerText=auto;document.getElementById('upgradeCost').innerText=upgradeCost;document.getElementById('tapCountText').innerText=tapCount;document.getElementById('tapInfo').innerText=(tapCount%15)+'/15';document.getElementById('progress').style.width=((tapCount%15)/15*100)+'%';document.getElementById('inviteLink').innerText='https://tomisantosa629.github.io/Jerapah-Dollar-/?ref='+myCode}updateUI();setInterval(()=>{coin+=auto;localStorage.setItem('coin',coin);updateUI()},1000);function tap(){coin+=5;tapCount++;localStorage.setItem('coin',coin);localStorage.setItem('tapCount',tapCount);updateUI();if(tapCount%15===0){showAd()}}function upgradeAuto(){if(coin<upgradeCost){alert('Butuh '+upgradeCost);return}coin-=upgradeCost;auto+=1;upgradeCost=getCost(auto+1);localStorage.setItem('coin',coin);localStorage.setItem('auto',auto);updateUI()}function openInvite(){document.getElementById('inviteModal').style.display='flex'}function closeInvite(){document.getElementById('inviteModal').style.display='none'}function shareWA(){let link='https://tomisantosa629.github.io/Jerapah-Dollar-/?ref='+myCode;window.open('https://wa.me/?text='+encodeURIComponent('Join jerapah: '+link),'_blank')}function showAd(){document.getElementById('adModal').style.display='flex';let btn=document.getElementById('closeBtn'),sec=5;btn.disabled=true;let iv=setInterval(()=>{sec--;btn.innerText='Tunggu '+sec+' detik...';if(sec<=0){clearInterval(iv);btn.innerText='Lanjut +20 KOIN!';btn.disabled=false;btn.className='bg-green-500 text-white w-full py-3 rounded-xl font-bold'}},1000)}function closeAd(){document.getElementById('adModal').style.display='none';coin+=20;localStorage.setItem('coin',coin);updateUI()}function openWD(){document.getElementById('wdModal').style.display='flex'}function closeWD(){document.getElementById('wdModal').style.display='none'}function kirimWD(){let n=document.getElementById('nama').value,d=document.getElementById('dana').value;if(!n||!d){alert('Lengkapi!');return}if(coin<25000){alert('Min 25000!');return}coin-=25000;localStorage.setItem('coin',coin);updateUI();closeWD();window.open('https://wa.me/6282318560428?text=WD $5 Nama:'+n+' DANA:'+d,'_blank')}</script></body></html>
