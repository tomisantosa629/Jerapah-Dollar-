<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WD Beneran</title><script src="https://cdn.tailwindcss.com"></script></head><body class="h-screen bg-sky-200 flex flex-col items-center justify-between p-4"><div class="bg-white p-3 rounded-xl w-full flex justify-between font-bold"><div>🪙<b id="coin">100</b></div><div>$<b id="dollar">0.1</b></div></div><div onclick="tap()" style="font-size:100px;text-align:center">🦒<div style="font-size:40px;margin-top:-20px">🕶️</div><div style="font-size:12px;background:black;color:white;border-radius:20px;padding:4px 10px;margin-top:10px">TAP AKU!</div></div><div class="w-full grid gap-2"><button onclick="tap()" class="bg-orange-400 border-b-8 border-orange-600 text-white py-4 rounded-2xl font-bold text-xl">TAP JOGET! (+10)</button><button onclick="openWD()" class="bg-green-500 border-b-4 border-green-700 text-white py-3 rounded-xl font-bold">💸 WD KE DANA - 082318560428</button></div><div id="wdModal" style="display:none" class="fixed inset-0 bg-black/60 flex items-center justify-center p-4"><div class="bg-white rounded-2xl p-5 w-full"><h2 class="font-bold text-center">💸 WD BENERAN</h2><p class="text-xs text-center">Min WD $1 = 1000 Koin</p><input id="nama" placeholder="Nama DANA" class="w-full border-2 p-3 rounded-xl mt-2"><input id="dana" placeholder="No DANA" class="w-full border-2 p-3 rounded-xl mt-2"><input id="jml" placeholder="Jumlah $ (1)" type="number" class="w-full border-2 p-3 rounded-xl mt-2"><button onclick="kirimWD()" class="w-full bg-green-500 text-white py-3 rounded-xl mt-3 font-bold">Kirim WD ke WA</button><button onclick="closeWD()" class="w-full bg-gray-200 py-2 rounded-xl mt-2">Batal</button></div></div><script>let coin=parseInt(localStorage.getItem('coin')||'100');function updateUI(){document.getElementById('coin').innerText=coin;document.getElementById('dollar').innerText=(coin/1000).toFixed(2)}updateUI();function tap(){coin+=10;localStorage.setItem('coin',coin);updateUI()}function openWD(){document.getElementById('wdModal').style.display='flex'}function closeWD(){document.getElementById('wdModal').style.display='none'}function kirimWD(){let n=document.getElementById('nama').value,d=document.getElementById('dana').value,j=document.getElementById('jml').value;if(!n||!d||!j){alert('Lengkapi dulu!');return}if(coin<j*1000){alert('Koin kurang! Punya '+coin+' butuh '+j*1000);return}coin-=j*1000;localStorage.setItem('coin',coin);updateUI();closeWD();let pesan=`WD JERAPAH%0ANama:${n}%0ADANA:${d}%0AWD:$${j}`;window.open('https://wa.me/6282318560428?text='+pesan,'_blank');alert('WD Terkirim ke 082318560428!')}</script></body></html>
