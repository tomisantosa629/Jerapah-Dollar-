er"></p><button onclick="shareWA()" class="bg-green-500 text-white w-full py-3 rounded-xl font-bold">📲 SHARE WA</button><button onclick="copyLink()" class="bg-blue-500 text-white w-full py-2 rounded-xl font-bold mt-2">📋 COPY LINK</button><button onclick="closeInvite()" class="bg-gray-200 w-full py-2 rounded-xl mt-3">Tutup</button></div></div><div id="adModal" style="display:none" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-2xl p-5 w-full max-w-sm text-center"><h3 class="font-bold">🎬 Iklan 5 Detik</h3><div class="bg-gray-100 rounded-xl p-6 my-3">IKLAN</div><button onclick="closeAd()" id="closeBtn" class="bg-gray-300 w-full py-3 rounded-xl font-bold">Tunggu 5...</button></div></div><div id="wdModal" style="display:none" class="fixed inset-0 bg-black/60 z-40 flex items-center justify-center p-4"><div class="bg-white rounded-2xl p-5 w-full max-w-sm"><h2 class="font-bold text-center">WD $5 = 25000 Koin</h2><input id="nama" placeholder="Nama DANA" class="w-full border-2 p-3 rounded-xl mt-2"><input id="dana" placeholder="No DANA" class="w-full border-2 p-3 rounded-xl mt-2"><button onclick="kirimWD()" class="w-full bg-green-500 text-white py-3 rounded-xl mt-3 font-bold">Kirim WD</button><button onclick="closeWD()" class="w-full bg-gray-200 py-2 rounded-xl mt-2">Batal</button></div></div><script>let coin=parseInt(localStorage.getItem('coin')||'100'),auto=parseInt(localStorage.getItem('auto')||'1'),friends=parseInt(localStorage.getItem('friends')||'0'),myCode=localStorage.getItem('myCode')||'JER'+Math.random().toString(36).substring(2,6).toUpperCase();localStorage.setItem('myCode',myCode);function getCost(l){return 500*Math.pow(2,l-1)}let upgradeCost=getCost(auto+1);function updateUI(){document.getElementById('coin').innerText=coin;document.getElementById('dollar').innerText=(coin/5000).toFixed(2);document.getElementById('autoCoin').innerText='+'+auto;document.getElementById('autoText').innerText='AUTO +'+auto+'/dtk';document.getElementById('friendCount').innerText=friends;document.getElementById('upgradeCost').innerText=upgradeCost;document.getElementById('inviteLink').innerText='https://tomisantosa629.github.io/Jerapah-Dollar-/?ref='+myCode}updateUI();setInterval(()=>{coin+=auto;localStorage.setItem('coin',coin);updateUI()},1000);let ref=new URLSearchParams(window.location.search).get('ref');if(ref&&ref!==myCode&&!localStorage.getItem('usedRef')){coin+=2500;friends+=1;localStorage.setItem('coin',coin);localStorage.setItem('friends',friends);localStorage.setItem('usedRef',ref);alert('Bonus teman '+ref+' = 2500 koin!');updateUI()}function tap(){coin+=5;localStorage.setItem('coin',coin);updateUI();if(Math.random()<0.12)showAd()}function upgradeAuto(){if(coin<upgradeCost){alert('Butuh '+upgradeCost+' koin! Main lagi!');return}coin-=upgradeCost;auto+=1;upgradeCost=getCost(auto+1);localStorage.setItem('coin',coin);localStorage.setItem('auto',auto);updateUI();alert('Jadi +'+auto+'/detik! Cost selanjutnya '+upgradeCost)}function openInvite(){document.getElementById('inviteModal').style.display='flex'}function closeInvite(){document.getElementById('inviteModal').style.display='none'}function shareWA(){let link='https://tomisantosa629.github.io/Jerapah-Dollar-/?ref='+myCode;window.open('https://wa.me/?text='+encodeURIComponent('Game jerapah dapet duit! Auto +'+auto+'/detik! Join: '+link),'_blank')}function copyLink(){navigator.clipboard.writeText('https://tomisantosa629.github.io/Jerapah-Dollar-/?ref='+myCode);alert('Copied!')}function showAd(){document.getElementById('adModal').style.display='flex';let btn=document.getElementById('closeBtn'),sec=5;btn.disabled=true;let iv=setInterval(()=>{sec--;btn.innerText='Tunggu '+sec+'...';if(sec<=0){clearInterval(iv);btn.innerText='Lanjut +10 Bonus';btn.disabled=false;btn.className='bg-green-500 text-white w-full py-3 rounded-xl font-bold'}},1000)}function closeAd(){document.getElementById('adModal').style.display='none';coin+=10;localStorage.setItem('coin',coin);updateUI()}function openWD(){document.getElementById('wdModal').style.display='flex'}function closeWD(){document.getElementById('wdModal').style.display='none'}function kirimWD(){let n=document.getElementById('nama').value,d=document.getElementById('dana').value;if(!n||!d){alert('Lengkapi!');return}if(coin<25000){alert('Min 25000 koin ($5)! Kamu '+coin);return}coin-=25000;localStorage.setItem('coin',coin);updateUI();closeWD();window.open('https://wa.me/6282318560428?text=WD%20$5%20Nama:'+n+'%20DANA:'+d,'_blank')}</script></body></html>
