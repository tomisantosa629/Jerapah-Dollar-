<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jerapah Dollar Auto</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-sky-200 min-h-screen flex flex-col items-center p-3"><div class="bg-white w-full max-w-sm rounded-xl p-3 flex justify-between font-bold"><span>🪙<b id="coin">100</b></span><span>$<b id="dollar">0.10</b> <small id="autoText" class="text-green-500 text-[10px]">+1/detik AUTO</small></span></div><div onclick="tap()" class="text-[100px] mt-2 text-center">🦒<div class="text-[40px] -mt-2">🕶️</div><div class="text-[11px] bg-black text-white px-3 py-1 rounded-full mt-2 animate-bounce">TAP AKU!</div></div><div class="bg-yellow-100 border-2 border-yellow-400 rounded-xl p-2 w-full max-w-sm mt-3 text-center"><p class="text-xs font-bold">🤖 AUTO JOGET AKTIF: <span id="autoCoin">+1</span> koin / detik</p><p class="text-[10px]">Diam aja koin tetap jalan!</p></div><div class="w-full max-w-sm mt-4 grid gap-2"><button onclick="tap()" class="bg-orange-400 border-b-8 border-orange-600 text-white py-4 rounded-2xl font-bold text-xl">TAP JOGET! (+10)</button><button onclick="upgradeAuto()" class="bg-blue-500 border-b-4 border-blue-700 text-white py-2 rounded-xl font-bold text-sm">⬆️ UPGRADE AUTO (+1/detik) = 500 Koin</button><button onclick="openWD()" class="bg-green-500 border-b-4 border-green-700 text-white py-3 rounded-xl font-bold">💸 WD KE DANA</button><p class="text-[9px] text-center">Min WD $5 - Koin Auto Save</p></div><div id="adModal" style="display:none" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-2xl p-5 w-full max-w-sm text-center"><h3 class="font-bold text-lg">🎬 Iklan 5 Detik</h3><p class="text-xs my-2">Bonus +20 koin kalau nonton!</p><div class="bg-gray-100 rounded-xl p-6 my-3 font-bold">IKLAN<br><small>(Tempat Iklan Google)</small></div><button onclick="closeAd()" id="closeBtn" class="bg-gray-300 w-full py-3 rounded-xl font-bold">Tunggu 5 detik...</button></div></div><div id="wdModal" style="display:none" class="fixed inset-0 bg-black/60 z-40 flex items-center justify-center p-4"><div class="bg-white rounded-2xl p-5 w-full max-w-sm"><h2 class="font-bold text-center">WD $5 = 5000 Koin</h2><input id="nama" placeholder="Nama DANA" class="w-full border-2 p-3 rounded-xl mt-2"><input id="dana" placeholder="No DANA" class="w-full border-2 p-3 rounded-xl mt-2"><input id="jml" value="5" type="number" class="w-full border-2 p-3 rounded-xl mt-2"><button onclick="kirimWD()" class="w-full bg-green-500 text-white py-3 rounded-xl mt-3 font-bold">Kirim WD ke WA Admin</button><button onclick="closeWD()" class="w-full bg-gray-200 py-2 rounded-xl mt-2">Batal</button></div></div><script>let coin=parseInt(localStorage.getItem('coin')||'100'),auto=parseInt(localStorage.getItem('auto')||'1'),tapCount=0;function updateUI(){document.getElementById('coin').innerText=coin;document.getElementById('dollar').innerText=(coin/1000).toFixed(2);document.getElementById('autoCoin').innerText='+'+auto}updateUI();setInterval(()=>{coin+=auto;localStorage.setItem('coin',coin);updateUI()},1000);function tap(){coin+=10;tapCount++;localStorage.setItem('coin',coin);updateUI();if(tapCount%10==0)showAd()}function upgradeAuto(){if(coin<500){alert('Koin kurang! Butuh 500');return}coin-=500;auto+=1;localStorage.setItem('coin',coin);localStorage.setItem('auto',auto);updateUI();document.getElementById('autoText').innerText='AUTO +'+auto+'/detik';alert('UPGRADE BERHASIL! Sekarang +'+auto+' koin/detik AUTO!')}function showAd(){document.getElementById('adModal').style.display='flex';let btn=document.getElementById('closeBtn'),sec=5;btn.disabled=true;let iv=setInterval(()=>{sec--;btn.innerText='Tunggu '+sec+' detik...';if(sec<=0){clearInterval(iv);btn.innerText='Lanjut +20 Bonus';btn.disabled=false;btn.className='bg-green-500 text-white w-full py-3 rounded-xl font-bold'}},1000)}function closeAd(){document.getElementById('adModal').style.display='none';coin+=20;localStorage.setItem('coin',coin);updateUI()}function openWD(){document.getElementById('wdModal').style.display='flex'}function closeWD(){document.getElementById('wdModal').style.display='none'}function kirimWD(){let n=document.getElementById('nama').value,d=document.getElementById('dana').value,j=document.getElementById('jml').value;if(!n||!d||!j){alert('Lengkapi!');return}if(coin<j*1000){alert('Koin kurang!');return}if(j<5){alert('Min WD $5!');return}coin-=j*1000;localStorage.setItem('coin',coin);updateUI();closeWD();window.open('https://wa.me/6282318560428?text=WD%20JERAPAH%0ANama:'+n+'%0ADANA:'+d+'%0AWD:$'+j,'_blank');alert('WD Terkirim! Proses 1x24 Jam')}</script></body></html>
