<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jerapah Joget - No Ads</title>
<style>
body { background:#BFE9FF; font-family:Arial,sans-serif; text-align:center; margin:0; padding:10px; }
.top { background:white; border-radius:30px; padding:12px 20px; display:flex; justify-content:space-between; font-weight:bold; max-width:500px; margin:10px auto; }
.jerapah { font-size:90px; cursor:pointer; margin:20px 0 5px; }
.btn-black { background:black; color:white; border:none; padding:12px 35px; border-radius:30px; font-weight:bold; cursor:pointer; }
.btn { width:90%; max-width:500px; border:none; padding:18px; border-radius:25px; font-weight:bold; font-size:20px; color:white; cursor:pointer; margin:8px auto; display:block; }
.orange { background:#FF8C28; } .blue { background:#2B7CFF; } .green { background:#2ECC71; }
</style>
</head>
<body>
<div class="top">
<span>🪙 <span id="coin">4483</span> (<span id="tapcount">0</span>/15)</span>
<span>$<span id="dollar">0.90</span></span>
</div>
<div class="jerapah" id="jerapah" onclick="tap()">🦒</div>
<div>😎</div>
<button class="btn-black" onclick="tap()">TAP AKU!</button>
<button class="btn orange" onclick="tapJoget()">TAP JOGET! (+5)</button>
<button class="btn blue" onclick="upgrade()">UPGRADE AUTO (<span id="cost">32000</span>) AUTO:<span id="auto">6</span></button>
<button class="btn green" onclick="wd()">💵 WD $5</button>
<p style="margin-top:20px; font-size:12px; color:#555;">Versi Bersih Tanpa Iklan - by Tomi</p>
<script>
let coin=4483,taps=0,auto=6,cost=32000,dollars=0.90;
function update(){coinEl();} function coinEl(){document.getElementById('coin').innerText=coin;document.getElementById('tapcount').innerText=taps%15;document.getElementById('auto').innerText=auto;document.getElementById('cost').innerText=cost;document.getElementById('dollar').innerText=dollars.toFixed(2);}
function tap(){coin++;taps++;if(taps%15===0){dollars+=0.05;}coinEl();}
function tapJoget(){coin+=5;taps+=2;coinEl();tap();}
function upgrade(){if(coin>=cost){coin-=cost;auto++;cost=Math.floor(cost*1.8);coinEl();}else alert('Koin kurang!');}
function wd(){if(dollars>=5){alert('WD $5 Berhasil!');dollars-=5;coinEl();}else alert('Minimal $5 dulu! $'+dollars.toFixed(2));}
setInterval(()=>{if(auto>0){coin+=auto;coinEl();}},1000);
</script>
</body>
</html>
